[alias]
xtask = "run --quiet --package xtask --"
# `cargo ship beta`, `cargo ship minor --stable`…: requests a release (see `cargo xtask release`)
ship = "run --quiet --package xtask -- release"

# MSVC: links the C and C++ runtimes statically (/MT, also for Skia's prebuilt
# binaries), so the exe needs no vcruntime140.dll / msvcp140.dll.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
