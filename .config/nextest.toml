# `cargo nextest run --profile ci`: every test runs, failures or not, and the results go to
# target/nextest/ci/junit.xml for the CI report (`cargo xtask report-build --tests`)
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# `cargo xtask e2e -- --profile ci-e2e`: the same for the end-to-end tests, which CI runs beside the
# others, so into a JUnit file of their own (target/nextest/ci-e2e/junit.xml)
[profile.ci-e2e]
fail-fast = false

[profile.ci-e2e.junit]
path = "junit.xml"
