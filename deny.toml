# `cargo deny check`: the advisories, licenses and sources of the dependency tree (CI runs it).

[advisories]
# a newly accepted advisory goes here with its reason
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack, through russh's rsa feature; no fixed release" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled in by Slint and winit" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained; pulled in by the Secret Service store" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained; pulled in by the Secret Service store" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; pulled in by the Secret Service store" },
]

[licenses]
# compatible with distributing a GPL-3.0-only application; Slint's own licenses are offered
# as `GPL-3.0-only OR ...`, the app takes the GPL one
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# the workspace's own path dependency and the Slint fork (a git revision) carry no version
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/iRed4321/SlintFork.git"]
