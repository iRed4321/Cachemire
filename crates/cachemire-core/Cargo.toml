[package]
name = "cachemire-core"
version = "0.0.0"
edition = "2024"
authors.workspace = true
description = "Cachemire's UI-independent core: Redis, Redisql, SSH tunnels, AWS"
license = "GPL-3.0-only"
publish = false

[features]
# `test_support` and the in-memory stores, for the app's tests
test-support = []

[dependencies]
tokio.workspace = true
redis = { version = "1", default-features = false, features = ["script", "tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
uuid.workspace = true
url = "2"
percent-encoding = "2"
dirs.workspace = true
rustc-hash.workspace = true
parking_lot.workspace = true
# the OS credential store (see src/secret_vault): keyring-core, and each platform's store below
keyring-core = "1"
russh.workspace = true
rayon.workspace = true
natord = "1"
# AWS (ElastiCache listing, SSO login). The TLS stack is rustls on `ring`, set on
# each client by hand (see src/aws/mod.rs), like russh (see the workspace manifest)
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso"] }
aws-credential-types = "1"
aws-sdk-elasticache = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sso = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-ssooidc = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-runtime = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"
aws-types = "1"
aws-smithy-types = "1"
# the SSO sign-in's PKCE challenge and the name of its token's cache file (see src/aws/sso.rs)
base64 = "0.23"
getrandom = { version = "0.3", features = ["std"] }
sha1 = "0.11"
sha2 = "0.11"
open.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver.workspace = true
thiserror.workspace = true
sys-locale = "0.3"
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
