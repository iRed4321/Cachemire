[package]
name = "cachemire-core"
version = "0.0.0"
edition = "2024"
authors.workspace = true
description = "Cachemire's UI-independent core: Redis, Redisql, SSH tunnels, AWS"
license = "GPL-3.0-only"
publish = false

[features]
# `test_support` and the in-memory stores, for the app's tests
test-support = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
redis = { version = "1", default-features = false, features = ["script", "tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
dirs = "7"
rustc-hash = "2"
keyring = "4"
# SSH tunnels to the Redis server; `ring` rather than the default aws-lc-rs,
# which needs a C toolchain (cmake/nasm) to build on Windows
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
rayon = "1.12.0"
natord = "1"
# AWS (ElastiCache listing, SSO login). The TLS stack is rustls on `ring`, set on
# each client by hand (see src/aws/mod.rs), like russh above
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "sso"] }
aws-credential-types = "1"
aws-sdk-elasticache = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sso = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-ssooidc = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-runtime = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"
aws-types = "1"
open = "5"
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"
thiserror = "2"
sys-locale = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
