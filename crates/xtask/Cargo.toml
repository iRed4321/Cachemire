[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
authors.workspace = true
publish = false
description = "Development tasks: translations, release requests and the Windows/Linux release build (`cargo xtask`)"

[dependencies]
semver.workspace = true
clap = { version = "4", features = ["derive"] }
rspolib = "0.1"
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
