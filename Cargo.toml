[package]
name = "cachemire"
version = "0.0.0-dev"
edition = "2024"
build = "build.rs"
description = "Redis key explorer"
license = "GPL-3.0-only"

[workspace]
members = ["xtask"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.17"
# SSH tunnels to the Redis server; `ring` rather than the default aws-lc-rs,
# which needs a C toolchain (cmake/nasm) to build on Windows
dirs = "7"
rustc-hash = "2"
keyring = "4"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
rayon = "1.12.0"
natord = "1"
# AWS (ElastiCache listing, SSO login). The TLS stack is rustls on `ring`, set on
# each client by hand (see backend/aws.rs), like russh above
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "sso"] }
aws-credential-types = "1"
aws-sdk-elasticache = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sso = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-ssooidc = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-runtime = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"
aws-types = "1"
open = "5"
slint = { git = "https://github.com/iRed4321/SlintFork.git", branch = "patched/1.18.1", features = ["unstable-winit-030"] }
rust-i18n = "4"
sys-locale = "0.3"

[build-dependencies]
slint-build = { git = "https://github.com/iRed4321/SlintFork.git", branch = "patched/1.18.1" }

# embeds assets/icon.ico (+ version info) into the Windows executable
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo xtask build-deb` (cargo-deb): the .deb layout
[package.metadata.deb]
maintainer = "Léo Parent <ired4321@gmail.com>"
section = "database"
extended-description = "Browse a Redis keyspace as a tree, read values as colored JSON, filter them with a JSON path and see them as a table. Reaches servers behind an SSH bastion."
depends = "libc6, libgcc-s1, libfontconfig1, libfreetype6"
recommends = "gnome-keyring | kwalletmanager, libwayland-client0, libxkbcommon0, libx11-6, libxkbcommon-x11-0"
assets = [
    ["target/release/cachemire", "usr/bin/", "755"],
    ["assets/cachemire.desktop", "usr/share/applications/", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/cachemire.svg", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/cachemire.png", "644"],
]

# smaller, leaner binary; panic stays "unwind" so a panic in one background
# task doesn't take the whole app down
[profile.release]
lto = true
codegen-units = 1
strip = true

# release-level speed without the slow release link (no LTO, parallel codegen,
# incremental), for trying the real thing: `cargo run --profile fast`.
# Symbols are kept and line tables are on, so backtraces stay readable.
# Output goes to target/fast/.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = "line-tables-only"
