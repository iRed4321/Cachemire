[workspace]
members = ["crates/*"]
# `cargo build`, `run` and `test` at the root act on the app and its core alone
default-members = ["crates/cachemire", "crates/cachemire-core"]
resolver = "3"

# inherited by every crate (`authors.workspace = true`)
[workspace.package]
authors = ["Léo Parent <leoparentperso@gmail.com>"]

# the dependencies more than one crate takes (`tokio.workspace = true`); a crate
# adds the features only it needs
[workspace.dependencies]
dirs = "7"
open = "5"
# mutexes without poisoning: a task that panics holding one leaves it usable
parking_lot = "0.13"
rayon = "1.12.0"
# SSH tunnels to the Redis server; `ring` rather than the default aws-lc-rs,
# which needs a C toolchain (cmake/nasm) to build on Windows
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
rustc-hash = "2"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

# smaller, leaner binary; panic stays "unwind" so a panic in one background
# task doesn't take the whole app down
[profile.release]
lto = true
codegen-units = 1
strip = true

# release-level speed without the slow release link (no LTO, parallel codegen,
# incremental), for trying the real thing: `cargo run --profile fast`.
# Symbols are kept and line tables are on, so backtraces stay readable.
# Output goes to target/fast/.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = "line-tables-only"
