name: Release

# Publishes a release once its tests and builds pass, tagging its commit: a beta of next pushed as
# release/<request> (`cargo ship`), or a fix or stable pull request merged into main with the `release`
# label (`cargo ship fix`, `cargo ship stable`). Started by hand (`cargo ship try`), it only builds.
on:
  push:
    branches: ["release/*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      request:
        description: try builds the branch's packages without releasing them; beta releases next as the next beta
        type: choice
        options: [try, beta]
        default: try

# nothing beyond reading the repository, unless a job asks for more
permissions:
  contents: read

# one release at a time, so two can't work out the same version; a try build has a group per branch, and a
# pull request closed without being released one of its own, so neither holds up or cancels a waiting release
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.request == 'try' && format('try-{0}', github.ref)
    || github.event_name == 'pull_request' && !(github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')) && format('not-released-{0}', github.run_id)
    || 'release' }}
  cancel-in-progress: false

# colored logs without progress bars; test builds keep line tables only, enough for backtraces
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# bash on Windows too: the version is passed as "$VERSION"
defaults:
  run:
    shell: bash

jobs:
  # what's released, worked out once: the commit (a merged pull request's merge commit), its version from
  # the tags, and whether it's only a try build. A pull request closed without the label releases nothing
  plan:
    name: Version
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.next.outputs.sha }}
      version: ${{ steps.next.outputs.version }}
      try: ${{ steps.next.outputs.try }}
    steps:
      # the whole history, for the tags the version is worked out from and the branches checked
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: ./.github/actions/xtask
        with:
          upload: true
      # a beta comes from next and a release from main (merged pull request); a try build from any branch
      - id: next
        name: Next version
        env:
          REQUEST: ${{ inputs.request }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          try=false
          case "$GITHUB_EVENT_NAME" in
            push) request=${GITHUB_REF_NAME#release/} ;;
            pull_request)
              case "$HEAD_REF" in
                fix/*) request=fix ;;
                stable/*) request=${HEAD_REF#stable/} ;;
                *) echo "::error::$HEAD_REF is neither a fix/ nor a stable/ branch: only those are released"; exit 1 ;;
              esac ;;
            workflow_dispatch)
              if [[ "$REQUEST" == try ]]; then
                # built as what it leads to: a fix of the stable, or next's next beta
                try=true
                [[ "$GITHUB_REF_NAME" == fix/* || "$GITHUB_REF_NAME" == main ]] && request=fix || request=beta
              else
                request=beta
                [[ "$GITHUB_REF_NAME" == next ]] || { echo "::error::betas are released from next, not $GITHUB_REF_NAME"; exit 1; }
              fi ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$request" == beta* ]] || { echo "::error::release/$request: only betas are requested by a branch, stable releases and fixes by pull requests"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/next || { echo "::error::$SHA is not on next: betas are released from next"; exit 1; }
          fi
          if [[ "$try" == true ]]; then
            version=$(xtask next-version "$request" --try "$GITHUB_RUN_NUMBER")
            echo "Try build of $GITHUB_REF_NAME as $version, from $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            version=$(xtask next-version "$request")
            echo "Releasing $version from $SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "sha=$SHA"; echo "version=$version"; echo "try=$try"; } >> "$GITHUB_OUTPUT"

  # xtask's Windows executable, for the Windows jobs: a branch's cache isn't readable from the others, an artifact is
  xtask-windows:
    name: xtask (Windows)
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: ./.github/actions/xtask
        with:
          upload: true

  # Clippy and the tests, side by side on each OS (a try build skips them: the pull request's checks run them)
  test:
    name: ${{ matrix.task == 'lint' && 'Clippy' || 'Tests' }} (${{ matrix.os }})
    needs: [plan, xtask-windows]
    if: needs.plan.outputs.try != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        task: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      # Windows: CARGO_HOME, RUSTUP_HOME and `target` (a junction) on a trusted Dev Drive (ReFS, which the
      # antivirus leaves alone), faster for the many small files of crates, Rust and builds. No cache here,
      # so `target` can be a junction (a cache would keep the link only). The Windows jobs share these steps
      - &dev-drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 20GB
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - &dev-drive-folders
        name: Cargo's home and the build folder on the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:CARGO_HOME\bin", "$env:DEV_DRIVE\target" -Force | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CARGO_HOME\bin"
          New-Item -ItemType Junction -Path target -Target "$env:DEV_DRIVE\target" | Out-Null
      # the Rust of rust-toolchain.toml, in a step of its own to time it
      - &toolchain
        name: Rust toolchain
        run: rustup toolchain install
      # nextest runs the tests: installed in the background, until the wait before the tests' build
      - name: Install cargo-nextest
        if: matrix.task == 'test'
        background: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/xtask-download
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - &fetch
        name: Fetch crates
        run: cargo fetch --locked --quiet
      # the packages' files kept in a cache: a hit skips apt (its index and downloads) altogether.
      # `version` names the cache: change it to start a new one (a new runner image, say)
      - &linux-libraries
        name: Install Linux libraries
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          version: 1
      # the checks of the CI's lint job; --timings + `report-build`: what was built, for the summary job
      - name: Clippy
        if: matrix.task == 'lint'
        timeout-minutes: 45
        run: cargo clippy --all-targets --timings -- -D warnings
      - name: Save the report (clippy)
        if: matrix.task == 'lint'
        run: xtask report-build Clippy
      # the tests, as the CI's test job runs them but for coverage
      - name: Wait for nextest
        wait-all:
      # the e2e tests' Redis on Windows (no Linux containers there): a native build, which `cargo xtask e2e`
      # takes first, unzipped in the background during the tests' build. Not WSL: it can lock the runner up
      - name: Install Redis
        if: matrix.task == 'test' && runner.os == 'Windows'
        background: true
        timeout-minutes: 5
        env:
          REDIS_VERSION: 8.10.3
          REDIS_SHA256: af16df340525b431e9ec8dabfd625d5e7a233f82805b5418819904ea909c447f
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          name="Redis-$REDIS_VERSION-Windows-x64-msys2"
          curl -fsSL --retry 3 --max-time 120 -o "$tmp/redis.zip" \
            "https://github.com/redis-windows/redis-windows/releases/download/$REDIS_VERSION/$name.zip"
          echo "$REDIS_SHA256  $tmp/redis.zip" | sha256sum -c -
          7z x -y -o"$(cygpath -w "$tmp")" "$(cygpath -w "$tmp/redis.zip")" > /dev/null
          mv "$tmp/$name" "$tmp/redis"
      - name: Build the tests
        if: matrix.task == 'test'
        id: build
        timeout-minutes: 45
        run: cargo nextest run --no-run --timings
      - name: Wait for Redis
        wait-all:
      # in the background beside the others, as they mostly wait on Redis; their own nextest profile, so
      # their own JUnit file
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        background: true
        run: |
          mkdir -p target/test-output
          if [[ $RUNNER_OS == Windows ]]; then PATH="$(cygpath -u "$RUNNER_TEMP")/redis:$PATH"; fi
          xtask e2e -- --profile ci-e2e || failed=1
          if [[ -f target/nextest/ci-e2e/junit.xml ]]; then cp target/nextest/ci-e2e/junit.xml target/test-output/e2e.xml; fi
          exit ${failed:-0}
      - name: Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p target/test-output
          cargo nextest run --profile ci || failed=1
          if [[ -f target/nextest/ci/junit.xml ]]; then cp target/nextest/ci/junit.xml target/test-output/tests.xml; fi
          exit ${failed:-0}
      - name: Wait for the end-to-end tests
        wait-all:
      - name: Save the report (tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xtask report-build Tests --tests "Tests=target/test-output/tests.xml" --tests "End-to-end=target/test-output/e2e.xml"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.task }}-${{ matrix.os }}
          path: target/reports/
          retention-days: 5

  windows:
    name: Windows (MSI and portable zip)
    needs: [plan, xtask-windows]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - *dev-drive
      - *dev-drive-folders
      - *toolchain
      # WiX makes the MSI: installed in the background, during the crates, until the wait before the build
      - name: Install WiX
        background: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "7.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - uses: ./.github/actions/xtask-download
      - *fetch
      - name: Wait for WiX
        wait-all:
      - name: Build
      # a beta (a version with a suffix, a try build too) is built without LTO: much quicker, and
      # stripped like a release so its packages stay the same size
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FAST: ${{ contains(needs.plan.outputs.version, '-') && '--fast' || '' }}
          CARGO_PROFILE_FAST_STRIP: "true"
          CARGO_PROFILE_FAST_DEBUG: "false"
          CARGO_PROFILE_FAST_INCREMENTAL: "false"
        run: xtask build-windows --as-version "$VERSION" $FAST --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-windows
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            target/windows*/*.msi
            target/windows*/Cachemire-Portable-*.zip

  linux:
    name: Linux (deb and AppImage)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - *toolchain
      # cargo-deb makes the .deb: installed in the background, until the wait before the build
      - name: Install cargo-deb
        background: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - uses: ./.github/actions/xtask-download
      # a stable release's notes: its section of CHANGELOG.md, checked before anything is built
      - name: Release notes
        if: ${{ !contains(needs.plan.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p target/notes
          xtask release-notes "$VERSION" > target/notes/release-notes.md
      - if: ${{ !contains(needs.plan.outputs.version, '-') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: target/notes/release-notes.md
      - *fetch
      - *linux-libraries
      - name: Wait for cargo-deb
        wait-all:
      - name: Build
      # a beta (a version with a suffix, a try build too) is built without LTO: much quicker, and
      # stripped like a release so its packages stay the same size
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FAST: ${{ contains(needs.plan.outputs.version, '-') && '--fast' || '' }}
          CARGO_PROFILE_FAST_STRIP: "true"
          CARGO_PROFILE_FAST_DEBUG: "false"
          CARGO_PROFILE_FAST_INCREMENTAL: "false"
        run: xtask build-linux --as-version "$VERSION" $FAST --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-linux
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: |
            target/debian/*.deb
            target/appimage*/*.AppImage

  # the tag is made here, on the released commit: it only exists once everything passed
  publish:
    name: GitHub release
    needs: [plan, test, windows, linux]
    if: needs.plan.outputs.try != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # the build provenance attestations of the packages
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # signed proof of which workflow run built each package (`gh attestation verify <file> --repo <owner/repo>`)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.msi
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.AppImage
      # SHA256SUMS: one line per package, by file name (`sha256sum --check SHA256SUMS` next to the downloads)
      - name: Checksums
        run: |
          mkdir sums
          find dist -type f | sort | while read -r file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done > sums/SHA256SUMS
          cat sums/SHA256SUMS
      - if: ${{ !contains(needs.plan.outputs.version, '-') }}
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          flags=()
          # a version with a suffix (3.0.0-beta.10) is a pre-release
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # a stable one has hand-written notes, put before the generated ones (the full changelog link)
          [[ -f notes/release-notes.md ]] && flags+=(--notes-file notes/release-notes.md)
          # every file, as an artifact keeps the folders of its files (the linux one: debian/, appimage/)
          mapfile -t files < <(find dist -type f)
          files+=(sums/SHA256SUMS)
          gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "v$VERSION" --generate-notes "${flags[@]}"

  # removes the beta's request branch whatever happened, so the same request can be pushed again;
  # left alone if it was pushed anew meanwhile (that request runs next)
  cleanup:
    name: Remove the release request
    needs: [plan, test, windows, linux, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Delete ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha) && [[ "$current" == "$GITHUB_SHA" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          fi

  # one summary for the whole run, from the reports the jobs saved (`cargo xtask report-build`)
  summary:
    name: Summary
    needs: [plan, test, windows, linux]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - if: needs.plan.result == 'success'
        uses: ./.github/actions/xtask-download
      - if: needs.plan.result != 'success'
        uses: ./.github/actions/xtask
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TRY: ${{ needs.plan.outputs.try }}
        run: |
          title="🚀 Release v$VERSION"
          [[ "$TRY" == true ]] && title="🧪 Try build v$VERSION"
          [[ -z "$VERSION" ]] && title="🚀 Release request $GITHUB_REF_NAME"
          xtask report "$title" --dir reports
