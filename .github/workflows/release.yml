name: Release

# Releases the commit pushed as a release/<request> branch (`cargo ship`), or the one
# picked here by hand: works out the version from the tags, tests and builds the packages as that
# version, then tags the commit and publishes the packages, only if everything passed.
on:
  push:
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      part:
        description: What to release (see `cargo ship --help`)
        type: choice
        options: [beta, stable, fix, minor, major]
        default: beta
      stable:
        description: With fix, minor or major, release the new version at once, with no beta
        type: boolean
        default: false

# one release at a time, so two can't work out the same version
concurrency:
  group: release
  cancel-in-progress: false

# colored logs without progress bars; test builds keep line tables only, enough for backtraces
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# bash on Windows too: the version is passed as "$VERSION"
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      # --timings + `report-build`: what was built, for the summary job
      - name: Test
        run: cargo test --timings
      - name: Save the report
        run: cargo xtask report-build Tests
      - uses: actions/upload-artifact@v7
        with:
          name: report-tests-${{ matrix.os }}
          path: target/reports/
          retention-days: 5

  windows:
    name: Windows (MSI and portable zip)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # the whole history, for the tags the version is worked out from
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # pushed: the request is the branch's name (release/fix-stable); started by hand: the form's
      - id: next
        name: Next version
        env:
          PART: ${{ inputs.part }}
          STABLE: ${{ inputs.stable }}
        run: |
          request=${PART:-${GITHUB_REF_NAME#release/}}
          [[ "$STABLE" == true ]] && request+=-stable
          version=$(cargo xtask next-version "$request")
          echo "Releasing $version from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "7.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - name: Build
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: cargo xtask build-windows --as-version "$VERSION" --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-windows
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            target/windows/*.msi
            target/windows/Cachemire-Portable-*.zip

  linux:
    name: Linux (deb and AppImage)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # the whole history, for the tags the version is worked out from
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # pushed: the request is the branch's name (release/fix-stable); started by hand: the form's
      - id: next
        name: Next version
        env:
          PART: ${{ inputs.part }}
          STABLE: ${{ inputs.stable }}
        run: |
          request=${PART:-${GITHUB_REF_NAME#release/}}
          [[ "$STABLE" == true ]] && request+=-stable
          version=$(cargo xtask next-version "$request")
          echo "Releasing $version from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # a stable release's notes: its section of CHANGELOG.md, checked before anything is built
      - name: Release notes
        if: ${{ !contains(steps.next.outputs.version, '-') }}
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          mkdir -p target/notes
          cargo xtask release-notes "$VERSION" > target/notes/release-notes.md
      - if: ${{ !contains(steps.next.outputs.version, '-') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: target/notes/release-notes.md
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: cargo xtask build-linux --as-version "$VERSION" --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-linux
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: |
            target/debian/*.deb
            target/appimage/*.AppImage

  # the tag is made here, on the released commit: it only exists once everything passed
  publish:
    name: GitHub release
    needs: [test, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - if: ${{ !contains(needs.linux.outputs.version, '-') }}
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          LINUX_VERSION: ${{ needs.linux.outputs.version }}
        run: |
          # each build worked out the version on its own, from the same tags
          [[ "$VERSION" == "$LINUX_VERSION" ]] || { echo "::error::Windows built $VERSION, Linux $LINUX_VERSION"; exit 1; }
          flags=()
          # a version with a suffix (3.0.0-beta.10) is a pre-release
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # a stable one has hand-written notes, put before the generated ones (the full changelog link)
          [[ -f notes/release-notes.md ]] && flags+=(--notes-file notes/release-notes.md)
          # every file, as an artifact keeps the folders of its files (the linux one: debian/, appimage/)
          mapfile -t files < <(find dist -type f)
          gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes "${flags[@]}"

  # removes the request branch whatever happened, so the same request can be pushed again;
  # left alone if it was pushed anew meanwhile (that request runs next)
  cleanup:
    name: Remove the release request
    needs: [test, windows, linux, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha) && [[ "$current" == "$GITHUB_SHA" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          fi

  # one summary for the whole run, from the reports the jobs saved (`cargo xtask report-build`)
  summary:
    name: Summary
    needs: [test, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summary
        env:
          VERSION: ${{ needs.windows.outputs.version || needs.linux.outputs.version }}
        run: |
          title="🚀 Release v$VERSION"
          [[ -z "$VERSION" ]] && title="🚀 Release request $GITHUB_REF_NAME"
          cargo xtask report "$title" --dir reports
