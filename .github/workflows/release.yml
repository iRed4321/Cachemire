name: Release

# Publishes a release once its tests and builds pass, tagging its commit: a beta of next pushed as
# release/<request> (`cargo ship`), or a fix or stable pull request merged into main with the `release`
# label (`cargo ship fix`, `cargo ship stable`). Started by hand (`cargo ship try`), it only builds.
on:
  push:
    branches: ["release/*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      request:
        description: try builds the branch's packages without releasing them; beta releases next as the next beta
        type: choice
        options: [try, beta]
        default: try

# one release at a time, so two can't work out the same version; a try build has a group per branch, and a
# pull request closed without being released one of its own, so neither holds up or cancels a waiting release
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.request == 'try' && format('try-{0}', github.ref)
    || github.event_name == 'pull_request' && !(github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')) && format('not-released-{0}', github.run_id)
    || 'release' }}
  cancel-in-progress: false

# colored logs without progress bars; test builds keep line tables only, enough for backtraces
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# bash on Windows too: the version is passed as "$VERSION"
defaults:
  run:
    shell: bash

jobs:
  # what's released, worked out once: the commit (a merged pull request's merge commit), its version from
  # the tags, and whether it's only a try build. A pull request closed without the label releases nothing
  plan:
    name: Version
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.next.outputs.sha }}
      version: ${{ steps.next.outputs.version }}
      try: ${{ steps.next.outputs.try }}
    steps:
      # the whole history, for the tags the version is worked out from and the branches checked
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      # xtask's own build (target/xtask) as the CI saved it from main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # a beta comes from next and a release from main (merged pull request); a try build from any branch
      - id: next
        name: Next version
        env:
          REQUEST: ${{ inputs.request }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          try=false
          case "$GITHUB_EVENT_NAME" in
            push) request=${GITHUB_REF_NAME#release/} ;;
            pull_request)
              case "$HEAD_REF" in
                fix/*) request=fix ;;
                stable/*) request=${HEAD_REF#stable/} ;;
                *) echo "::error::$HEAD_REF is neither a fix/ nor a stable/ branch: only those are released"; exit 1 ;;
              esac ;;
            workflow_dispatch)
              if [[ "$REQUEST" == try ]]; then
                # built as what it leads to: a fix of the stable, or next's next beta
                try=true
                [[ "$GITHUB_REF_NAME" == fix/* || "$GITHUB_REF_NAME" == main ]] && request=fix || request=beta
              else
                request=beta
                [[ "$GITHUB_REF_NAME" == next ]] || { echo "::error::betas are released from next, not $GITHUB_REF_NAME"; exit 1; }
              fi ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$request" == beta* ]] || { echo "::error::release/$request: only betas are requested by a branch, stable releases and fixes by pull requests"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/next || { echo "::error::$SHA is not on next: betas are released from next"; exit 1; }
          fi
          if [[ "$try" == true ]]; then
            version=$(cargo xtask next-version "$request" --try "$GITHUB_RUN_NUMBER")
            echo "Try build of $GITHUB_REF_NAME as $version, from $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            version=$(cargo xtask next-version "$request")
            echo "Releasing $version from $SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "sha=$SHA"; echo "version=$version"; echo "try=$try"; } >> "$GITHUB_OUTPUT"

  # a try build skips them: the pull request's checks run them
  test:
    name: Tests (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.try != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      # --timings + `report-build`: what was built, for the summary job
      - name: Test
        run: cargo test --timings
      - name: Save the report
        run: cargo xtask report-build Tests
      - uses: actions/upload-artifact@v7
        with:
          name: report-tests-${{ matrix.os }}
          path: target/reports/
          retention-days: 5

  windows:
    name: Windows (MSI and portable zip)
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "7.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: cargo xtask build-windows --as-version "$VERSION" --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-windows
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            target/windows/*.msi
            target/windows/Cachemire-Portable-*.zip

  linux:
    name: Linux (deb and AppImage)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      # a stable release's notes: its section of CHANGELOG.md, checked before anything is built
      - name: Release notes
        if: ${{ !contains(needs.plan.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p target/notes
          cargo xtask release-notes "$VERSION" > target/notes/release-notes.md
      - if: ${{ !contains(needs.plan.outputs.version, '-') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: target/notes/release-notes.md
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: cargo xtask build-linux --as-version "$VERSION" --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-linux
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: |
            target/debian/*.deb
            target/appimage/*.AppImage

  # the tag is made here, on the released commit: it only exists once everything passed
  publish:
    name: GitHub release
    needs: [plan, test, windows, linux]
    if: needs.plan.outputs.try != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - if: ${{ !contains(needs.plan.outputs.version, '-') }}
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          flags=()
          # a version with a suffix (3.0.0-beta.10) is a pre-release
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # a stable one has hand-written notes, put before the generated ones (the full changelog link)
          [[ -f notes/release-notes.md ]] && flags+=(--notes-file notes/release-notes.md)
          # every file, as an artifact keeps the folders of its files (the linux one: debian/, appimage/)
          mapfile -t files < <(find dist -type f)
          gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "v$VERSION" --generate-notes "${flags[@]}"

  # removes the beta's request branch whatever happened, so the same request can be pushed again;
  # left alone if it was pushed anew meanwhile (that request runs next)
  cleanup:
    name: Remove the release request
    needs: [plan, test, windows, linux, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha) && [[ "$current" == "$GITHUB_SHA" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          fi

  # one summary for the whole run, from the reports the jobs saved (`cargo xtask report-build`)
  summary:
    name: Summary
    needs: [plan, test, windows, linux]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      # xtask's own build (target/xtask) as the CI saved it from main; the app's builds aren't cached
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TRY: ${{ needs.plan.outputs.try }}
        run: |
          title="🚀 Release v$VERSION"
          [[ "$TRY" == true ]] && title="🧪 Try build v$VERSION"
          [[ -z "$VERSION" ]] && title="🚀 Release request $GITHUB_REF_NAME"
          cargo xtask report "$title" --dir reports
