name: Release

# Runs when a v* tag is pushed (made by `cargo bump`): tests and builds the packages from that
# tag side by side, and attaches the packages to a GitHub release only if everything passed.
on:
  push:
    tags: ["v*"]

# part of the rust-cache keys: keep the same as in cache.yml, which saves the caches read here
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # read-only: a tag's own cache can't be read by the next tag, so the caches come from main (cache.yml)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      # --timings + `report-build`: what was built, for the summary job
      - name: Test
        run: cargo test --timings
      - name: Save the report
        run: cargo xtask report-build Tests
      - uses: actions/upload-artifact@v7
        with:
          name: report-tests-${{ matrix.os }}
          path: target/reports/
          retention-days: 5

  windows:
    name: Windows (MSI and portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "7.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - name: Build
        run: cargo xtask build-windows --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-windows
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: |
            target/windows/*.msi
            target/windows/Cachemire-Portable-*.zip

  linux:
    name: Linux (deb and AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo xtask build-linux --report
      - uses: actions/upload-artifact@v7
        with:
          name: report-linux
          path: target/reports/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: |
            target/debian/*.deb
            target/appimage/*.AppImage

  publish:
    name: GitHub release
    needs: [test, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          # a tag with a suffix (v3.0.0-beta.10) is a pre-release
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # every file, as an artifact keeps the folders of its files (the linux one: debian/, appimage/)
          mapfile -t files < <(find dist -type f)
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Cachemire ${TAG#v}" --generate-notes "${flags[@]}"

  # one summary for the whole run, from the reports the jobs saved (`cargo xtask report-build`)
  summary:
    name: Summary
    needs: [test, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summary
        run: cargo xtask report "🚀 Release ${{ github.ref_name }}" --dir reports
