name: Release

# Runs when a v* tag is pushed (made by `cargo bump`); builds the packages
# from that tag and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (MSI and portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "7.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - name: Build
        run: cargo xtask build-windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/windows/*.msi
            target/windows/Cachemire-Portable-*.zip

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo xtask build-deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/debian/*.deb

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      - name: Build
        run: cargo xtask build-appimage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: target/appimage/*.AppImage

  publish:
    name: GitHub release
    needs: [windows, deb, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          # a tag with a suffix (v3.0.0-beta.10) is a pre-release
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Cachemire ${TAG#v}" --generate-notes "${flags[@]}"
