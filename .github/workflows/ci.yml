name: CI

# The checks of a pull request and of every push to main; releases run their own tests (release.yml).
on:
  pull_request:
  push:
    branches: [main]
    # a push touching only text has nothing to build
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# colored logs without progress bars; test builds keep line tables only, enough for backtraces
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # the compiled dependencies, kept between runs (one cache per OS); saved from main only,
      # which pull requests start from
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # xtask's own build (target/xtask), shared by every job of the OS, in both workflows
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      # --timings + `report-build`: what was built, for the summary job
      - name: Clippy
        run: cargo clippy --all-targets --timings -- -D warnings
      - name: Save the report (clippy)
        run: cargo xtask report-build Clippy
      - name: Test
        run: cargo test --timings
      - name: Save the report (tests)
        run: cargo xtask report-build Tests
      - uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.os }}
          path: target/reports/
          retention-days: 5

  # one summary for the whole run, from the reports the jobs saved (`cargo xtask report-build`)
  summary:
    name: Summary
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # xtask's own build (target/xtask), shared by every job of the OS, in both workflows
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          workspaces: ". -> target/xtask"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summary
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$PR" ]]; then title="🔍 Pull request #$PR"; else title="🔍 ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"; fi
          cargo xtask report "$title" --dir reports
