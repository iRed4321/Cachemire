name: CI

# The checks of a pull request; releases run their own tests (release.yml).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# part of the rust-cache keys: keep the same as in cache.yml, which saves the caches read here
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # read-only: a pull request's own cache can't be read by any other, so the caches come from main (cache.yml)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      # quiet: the build log then lists what gets compiled, not each crate downloaded
      - name: Fetch crates
        run: cargo fetch --locked --quiet
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
      # --timings + `cargo xtask timings`: what was built and the slowest crates, in the job summary
      - name: Clippy
        run: cargo clippy --all-targets --timings -- -D warnings
      - name: Report (clippy)
        run: cargo xtask timings "Clippy (${{ matrix.os }})"
      - name: Test
        run: cargo test --timings
      - name: Report (tests)
        run: cargo xtask timings "Tests (${{ matrix.os }})"
